<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Base href: change this if the app is served from a sub-path, e.g.
    "/pandd/" for GitHub Pages project sites. `build_web.ps1 -BaseHref /pandd/`
    rewrites this for you.
  -->
  <base href="/pandd-flashcards/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Swipe flashcards for Pest &amp; Disease identification - 87 cards, front photo, flip for the answer.">

  <!-- Theme / installable PWA (iPhone: Share -> Add to Home Screen) -->
  <meta name="theme-color" content="#12101A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PandD ID">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>PandD ID Trainer</title>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #12101A; }

    /* Splash shown while main.dart.js and the first card download. */
    #splash {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: #12101A; color: #f5f5f5;
      font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: opacity .3s ease;
    }
    #splash img { width: 108px; height: 108px; border-radius: 24px; }
    #splash .bar { width: 150px; height: 3px; border-radius: 3px; background: #26222f; overflow: hidden; }
    #splash .bar i { display: block; width: 40%; height: 100%; background: #19C37D;
                     animation: slide 1.1s ease-in-out infinite; }
    #splash small { color: #8b8798; font-weight: 400; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(375%); } }
    /* Older Flutter versions marked the first frame on <body>; newer ones
       don't, so the script below also watches for the flutter-view element. */
    body.flutter-first-frame #splash { display: none; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div>PandD ID Trainer</div>
    <div class="bar"><i></i></div>
    <small>Loading the deck&hellip;</small>
  </div>

  <script>
    // Fade the splash out once Flutter has attached its view (the page
    // background is the same colour, so the handover is invisible).
    (function () {
      var splash = document.getElementById('splash'), tries = 0;
      var timer = setInterval(function () {
        if (document.querySelector('flutter-view') ||
            (++tries > 600 && !splash.dataset.stuck)) {
          clearInterval(timer);
          splash.style.opacity = '0';
          setTimeout(function () { splash.remove(); }, 320);
        }
      }, 100);
    })();
  </script>

  <script>
    // Offline support: see app_service_worker.js. Registered after load so it
    // never competes with the first paint.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register('app_service_worker.js')
          .catch(function () { /* private mode / unsupported: the app still works */ });
      });
    }
  </script>

  <script>
    // Load Flutter. Pages answers with "cache-control: max-age=600", so a 404
    // seen while a deploy is still rolling out sits in the browser cache, or in
    // a proxy in front of it, for ten minutes: reloading keeps hitting that
    // cached 404 and the page looks dead on the splash screen. Retrying the
    // same URL returns the same cached 404, so each retry asks for a fresh
    // query string, which no cache can shadow.
    (function () {
      var tries = 0;
      function load() {
        var s = document.createElement('script');
        s.src = tries === 0
            ? 'flutter_bootstrap.js'
            : 'flutter_bootstrap.js?try=' + tries + '-' + Date.now();
        s.async = true;
        s.onerror = function () {
          s.remove();
          if (++tries <= 4) { setTimeout(load, 400 * tries); } else { stuck(); }
        };
        document.body.appendChild(s);
      }
      // Still no first frame after the retries: say so instead of leaving a
      // dark screen with a bar that slides forever.
      function stuck() {
        var splash = document.getElementById('splash');
        if (!splash || document.querySelector('flutter-view')) return;
        splash.dataset.stuck = '1';   // keep it: the fading timer must not go now
        splash.innerHTML =
            '<img src="icons/Icon-192.png" alt="">' +
            '<div>Could not load the deck</div>' +
            '<small>The site was probably mid-update. Try again in a moment.</small>' +
            '<button id="retry" style="padding:10px 22px;border-radius:999px;border:0;' +
            'background:#19C37D;color:#08240f;font:600 15px system-ui,sans-serif">' +
            'Try again</button>';
        document.getElementById('retry').onclick = function () {
          tries = 0;
          this.textContent = 'Trying...';
          load();
        };
      }
      load();
    })();
  </script>
</body>
</html>
